<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet"
        href="https://aladin.cds.unistra.fr/AladinLite/api/v3/latest/aladin.css" />
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script
      src="https://aladin.cds.unistra.fr/AladinLite/api/v3/latest/aladin.js"
      charset="utf-8">
  </script>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; color: #e8edf5; background: transparent; }
    .toolbar { display:flex; gap:10px; align-items:center; margin: 0 0 10px; flex-wrap:wrap; }
    button { border:0; border-radius:7px; padding:9px 14px; cursor:pointer; font-weight:600; }
    #draw { background:#2563eb; color:white; }
    #clear { background:#334155; color:white; }
    #status { font-size:13px; color:#94a3b8; }
    #aladin-lite-div { width:100%; height:570px; border-radius:10px; overflow:hidden; background:#050816; }
  </style>
</head>
<body>
  <div class="toolbar">
    <button id="draw">Draw rectangle</button>
    <button id="clear">Clear selection</button>
    <span id="status">Loading Aladin Lite…</span>
  </div>
  <div id="aladin-lite-div"></div>

<script>
(function () {
  // Minimal Streamlit Components v1 message bridge.
  function sendToStreamlit(type, extra) {
    const message = Object.assign({
      isStreamlitMessage: true,
      type: type
    }, extra || {});
    window.parent.postMessage(message, "*");
  }

  function setComponentValue(value) {
    sendToStreamlit("streamlit:setComponentValue", {
      value: value,
      dataType: "json"
    });
  }

  sendToStreamlit("streamlit:componentReady", {apiVersion: 1});
  sendToStreamlit("streamlit:setFrameHeight", {height: 630});

  let aladin = null;
  let lastSelection = null;
  let pendingArgs = null;
  let lastApplied = { target: null, survey: null, fov: null, nonce: null };
  // If the requested HiPS cannot be loaded (CDS outage, network problem, or
  // no coverage at the current position), fall back to DSS2 colour instead
  // of leaving a permanently black viewer.
  const FALLBACK_SURVEY = "P/DSS2/color";

  function setStatus(text) {
    document.getElementById("status").textContent = text;
  }

  function initAladin() {
    if (!window.A || !A.init) {
      setStatus("Aladin Lite failed to load. Check your internet connection.");
      return;
    }

    A.init.then(function () {
      const params = new URLSearchParams(window.location.search);
      // Streamlit component arguments are delivered through render messages.
      // Defaults are used here; Python passes target/survey/fov in component args
      // and the render listener below applies updates.
      aladin = A.aladin("#aladin-lite-div", {
        target: "NGC 1300",
        survey: FALLBACK_SURVEY,
        fov: 0.5,
        cooFrame: "ICRS",
        showReticle: false,
        showCooGrid: false
      });
      // The constructor already started loading this HiPS; record it so the
      // first render message does not re-request the same survey (double
      // load, doubled failure chances during a service outage).
      lastApplied.survey = FALLBACK_SURVEY;
      lastApplied.fov = 0.5;
      setStatus("Ready. Pan/zoom, then draw a rectangle around one object.");

      // Apply any render arguments that arrived before Aladin finished
      // initialising (e.g. the target chosen in the Streamlit sidebar).
      if (pendingArgs) {
        const queuedArgs = pendingArgs;
        pendingArgs = null;
        applyRenderArgs(queuedArgs);
      }
    }).catch(function (err) {
      setStatus("Aladin initialization error: " + err.message);
    });
  }

  document.getElementById("draw").addEventListener("click", function () {
    if (!aladin) return;
    setStatus("Drag on the sky viewer to select a rectangular region…");
    aladin.select("rect", function (selection) {
      try {
        // RectSelection exposes x, y, w, h in view pixels.
        const x1 = selection.x;
        const y1 = selection.y;
        const x2 = selection.x + selection.w;
        const y2 = selection.y + selection.h;

        const pixelCorners = [
          [x1, y1], [x2, y1], [x2, y2], [x1, y2]
        ];

        const corners = pixelCorners.map(function (p) {
          const world = aladin.pix2world(p[0], p[1], "ICRS");
          return [Number(world[0]), Number(world[1])];
        });

        lastSelection = {
          corners: corners,
          pixel_box: {x: x1, y: y1, width: selection.w, height: selection.h}
        };

        setComponentValue(lastSelection);
        setStatus("Rectangle selected. Coordinates sent to the Streamlit app.");
      } catch (err) {
        setStatus("Could not convert selection to sky coordinates: " + err.message);
      }
    });
  });

  document.getElementById("clear").addEventListener("click", function () {
    lastSelection = null;
    setComponentValue(null);
    setStatus("Selection cleared.");
  });

  // Switch the base HiPS survey with load feedback and a fallback.
  //
  // Aladin Lite v3's setBaseImageLayer accepts a survey id string (e.g.
  // "P/DSS2/color") or a HiPS object and, on recent builds, returns a
  // Promise that rejects when the HiPS cannot be loaded (server outage,
  // wrong id, network failure). Older builds return undefined. Without
  // this handling, a failed survey silently leaves a black view
  // (aladin-lite issue #358 — automatic fallback only added in v3.9).
  // A black view can also simply mean the survey has no data at the
  // current position — e.g. SDSS9 only covers the northern sky.
  function applySurvey(id) {
    if (!id || id === lastApplied.survey) return;
    lastApplied.survey = id;
    setStatus("Loading survey " + id + "\u2026");
    let outcome = null;
    try {
      outcome = aladin.setBaseImageLayer(id);
    } catch (err) {
      surveyLoadFailed(id, err);
      return;
    }
    if (outcome && typeof outcome.then === "function") {
      outcome
        .then(function () {
          setStatus(
            "Survey " + id + " loaded. Pan/zoom, then draw a rectangle " +
            "around one object."
          );
        })
        .catch(function (err) {
          surveyLoadFailed(id, err);
        });
    }
  }

  function surveyLoadFailed(id, err) {
    console.error("Survey could not be loaded:", id, err);
    // Forget the id so a later rerun can retry it, and restore a view
    // that is known to work instead of leaving the sky black.
    lastApplied.survey = null;
    setStatus(
      'Survey "' + id + '" failed to load' +
      (err && err.message ? " (" + err.message + ")" : "") +
      ". Back to DSS2 colour. A black sky usually means the survey is " +
      "temporarily unavailable or has no data here (SDSS9 = northern sky only)."
    );
    try {
      const fallback = aladin.setBaseImageLayer(FALLBACK_SURVEY);
      if (fallback && typeof fallback.then === "function") {
        fallback.catch(function () {});
      }
      lastApplied.survey = FALLBACK_SURVEY;
    } catch (fallbackErr) {
      console.error("Fallback survey failed:", fallbackErr);
    }
  }

  // Receive Python -> component render arguments and navigate to the
  // requested target without recreating the viewer.
  function applyRenderArgs(args) {
    if (!aladin) {
      // Aladin is still initialising; queue the arguments and apply them
      // as soon as the viewer is ready.
      pendingArgs = args;
      return;
    }

    try {
      const nonce = typeof args.target_nonce === "number" ? args.target_nonce : null;
      const forced = nonce !== null && nonce !== lastApplied.nonce;

      // Navigate only when the target changed or "Load sky" was pressed,
      // so unrelated Streamlit reruns never reset the user's view.
      if (args.target && (forced || args.target !== lastApplied.target)) {
        setStatus("Loading target: " + args.target + "…");
        aladin.gotoObject(args.target, {
          success: function (raDec) {
            lastApplied.target = args.target;
            setStatus(
              "Centred on " + args.target +
              ". Pan/zoom, then draw a rectangle around one object."
            );
            console.log("Target loaded:", args.target, raDec);
          },
          error: function () {
            setStatus(
              "Could not resolve target \"" + args.target + "\". Try an " +
              "object name like M 31, or RA/Dec in degrees (e.g. 83.63 +22.01)."
            );
            console.error("Unable to resolve target:", args.target);
          }
        });
      }

      applySurvey(args.survey);
      if (args.fov && Number(args.fov) !== lastApplied.fov) {
        aladin.setFoV(Number(args.fov));
        lastApplied.fov = Number(args.fov);
      }
      if (nonce !== null) {
        lastApplied.nonce = nonce;
      }
    } catch (err) {
      console.warn("Could not apply Aladin component arguments:", err);
    }
  }

  window.addEventListener("message", function (event) {
    const msg = event.data;
    if (!msg || msg.type !== "streamlit:render" || !msg.args) return;
    applyRenderArgs(msg.args);
  });

  initAladin();
})();
</script>
</body>
</html>
